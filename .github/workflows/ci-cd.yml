# ============================================
# CI/CD Pipeline — Build, Push, Deploy
# ============================================
#
# Pipeline Flow:
#   1. Lint & Build  →  validates code compiles
#   2. Convex Deploy →  pushes backend functions to Convex Cloud
#   3. Docker Build  →  builds image & pushes to Docker Hub
#   4. EC2 Deploy    →  (DISABLED until EC2 is configured)
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME           - Docker Hub username
#   DOCKERHUB_TOKEN              - Docker Hub access token
#   NEXT_PUBLIC_CONVEX_URL       - Convex cloud URL
#   NEXT_PUBLIC_CONVEX_SITE_URL  - Convex site URL
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY - Clerk publishable key
#   CLERK_SECRET_KEY             - Clerk secret key
#   CLERK_JWT_ISSUER_DOMAIN      - Clerk JWT issuer domain
#   NEXT_PUBLIC_UNSPLASH_ACCESS_KEY - Unsplash API key
#   GEMINI_API_KEY               - Google Gemini API key
#   CONVEX_DEPLOY_KEY            - Convex deploy key (from dashboard)
#
# NOT YET NEEDED (enable EC2 job when ready):
#   EC2_HOST                     - EC2 public IP
#   EC2_USERNAME                 - EC2 SSH user (ubuntu)
#   EC2_SSH_KEY                  - EC2 .pem key contents
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from Actions tab

# Prevent concurrent deployments — cancel older runs
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/eventify-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # ========================================
  # Job 1: Lint & Build Check
  # ========================================
  # Validates that the code compiles without errors.
  # ALL NEXT_PUBLIC_ vars must be present at build time
  # because Next.js inlines them during compilation.
  # ========================================
  build-check:
    name: ✅ Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true # Don't fail on lint warnings

      - name: Build Next.js
        run: npm run build
        env:
          # All NEXT_PUBLIC_ vars are REQUIRED at build time
          # because Next.js inlines them into the client bundle
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_UNSPLASH_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_UNSPLASH_ACCESS_KEY }}

  # ========================================
  # Job 2: Deploy Convex Backend Functions
  # ========================================
  # Pushes schema, queries, mutations to Convex Cloud.
  # Requires CONVEX_DEPLOY_KEY from Convex Dashboard →
  #   Settings → Deploy Key
  # ========================================
  convex-deploy:
    name: 🔄 Deploy Convex
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex functions
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}

  # ========================================
  # Job 3: Build & Push Docker Image
  # ========================================
  # Builds multi-stage Docker image and pushes to
  # Docker Hub with both SHA tag and :latest tag.
  # Runs in PARALLEL with Convex deploy (both need
  # only build-check to pass).
  # ========================================
  docker-build-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_UNSPLASH_ACCESS_KEY=${{ secrets.NEXT_PUBLIC_UNSPLASH_ACCESS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: echo "✅ Pushed ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"

  # ========================================
  # Job 4: Deploy to AWS EC2
  # ========================================
  # Requires these GitHub Secrets:
  #   EC2_HOST     - EC2 public IP or domain
  #   EC2_USERNAME - SSH user (ubuntu)
  #   EC2_SSH_KEY  - contents of your .pem file
  # ========================================
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [convex-deploy, docker-build-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,nginx/nginx.conf,monitoring/"
          target: "/home/${{ secrets.EC2_USERNAME }}/eventify"
          overwrite: true

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/eventify

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull the latest image
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Create .env file for docker compose
            cat > .env << 'ENVEOF'
            DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_UNSPLASH_ACCESS_KEY=${{ secrets.NEXT_PUBLIC_UNSPLASH_ACCESS_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            CLERK_JWT_ISSUER_DOMAIN=${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF

            # Move compose file into place
            cp deploy/docker-compose.prod.yml docker-compose.yml 2>/dev/null || true

            # Deploy with zero-downtime
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            echo "✅ Deployment complete!"

