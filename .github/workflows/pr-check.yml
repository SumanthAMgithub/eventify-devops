# ============================================
# PR Check — Validate on Pull Requests
# ============================================
# Runs lint + build on PRs to catch issues early
# Does NOT deploy or push Docker images
# ============================================

name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_UNSPLASH_ACCESS_KEY: placeholder

      - name: Docker build check
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_CONVEX_URL=https://placeholder.convex.cloud \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_placeholder \
            --build-arg NEXT_PUBLIC_UNSPLASH_ACCESS_KEY=placeholder \
            -t eventify:pr-test .
