# ============================================
# AI Event Organiser — Docker Compose
# ============================================
# Usage:
#   docker compose up --build        (first time / after code changes)
#   docker compose up -d             (detached mode)
#   docker compose down              (stop all)
#   docker compose logs -f app       (follow app logs)
# ============================================

services:
  # ----------------------------------------
  # Next.js Application
  # ----------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        - NEXT_PUBLIC_UNSPLASH_ACCESS_KEY=${NEXT_PUBLIC_UNSPLASH_ACCESS_KEY}
        - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL}
    container_name: eventify-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_JWT_ISSUER_DOMAIN=${CLERK_JWT_ISSUER_DOMAIN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eventify-network

  # ----------------------------------------
  # Nginx Reverse Proxy
  # ----------------------------------------
  nginx:
    image: nginx:alpine
    container_name: eventify-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - eventify-network

  # ----------------------------------------
  # Prometheus — Metrics Collection
  # ----------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: eventify-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - eventify-network

  # ----------------------------------------
  # Grafana — Monitoring Dashboard
  # ----------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: eventify-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - eventify-network

  # ----------------------------------------
  # Node Exporter — System Metrics
  # ----------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: eventify-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - eventify-network

# ----------------------------------------
# Shared Network
# ----------------------------------------
networks:
  eventify-network:
    driver: bridge

# ----------------------------------------
# Persistent Volumes
# ----------------------------------------
volumes:
  prometheus-data:
  grafana-data:
