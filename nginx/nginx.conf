# ============================================
# Nginx Reverse Proxy Configuration
# Eventify — AI Event Organiser
# ============================================

# Worker processes = auto-detect CPU cores
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

http {
    # ---- MIME Types ----
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging Format ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ---- Performance ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- Rate Limiting ----
    # 10 requests/second per IP, burst of 20
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # ---- Upstream — Next.js App ----
    upstream nextjs_app {
        server app:3000;
    }

    # ---- Server Block ----
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- Health Check Endpoint ----
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ---- Nginx Status (for Prometheus) ----
        location /nginx_status {
            stub_status on;
            access_log off;
            # Only allow internal Docker network
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }

        # ---- Static Assets (cache aggressively) ----
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            proxy_cache_valid 200 60d;
            add_header Cache-Control "public, max-age=5184000, immutable";
        }

        # ---- Public Assets ----
        location /public/ {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }

        # ---- Main App (reverse proxy) ----
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://nextjs_app;

            # Required proxy headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }
    }
}
