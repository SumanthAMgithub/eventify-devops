# ============================================
# Grafana — Auto-provision Dashboards
# ============================================
apiVersion: 1

providers:
  - name: 'Eventify Dashboards'
    orgId: 1
    folder: 'Eventify'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
